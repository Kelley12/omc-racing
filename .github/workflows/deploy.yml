name: Deploy to AWS

on:
  push:
    branches: [master]
  workflow_dispatch: # Allow manual triggers

permissions:
  id-token: write   # Required for OIDC token
  contents: read

env:
  AWS_REGION: us-west-2

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compute build version
        # Exposed to the build as NEXT_PUBLIC_BUILD_VERSION (e.g. 2026.06.23-51655cb)
        # and rendered in the site footer so we can confirm what's live.
        run: echo "NEXT_PUBLIC_BUILD_VERSION=$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build Next.js static export
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          NEXT_PUBLIC_GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
          NEXT_PUBLIC_BUILD_VERSION: ${{ env.NEXT_PUBLIC_BUILD_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static files to S3
        run: |
          aws s3 sync out/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=3600" \
            --exclude "*.html" \
            --exclude "admin/*"
          # HTML files get a shorter TTL so content updates propagate quickly
          aws s3 sync out/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html"
          # Admin files must not be cached (always latest CMS)
          aws s3 sync out/admin/ s3://${{ secrets.S3_BUCKET_NAME }}/admin/ \
            --cache-control "no-store"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
