name: Auto-merge

# Queues auto-merge for every PR that is ready for review (not a draft).
# GitHub then merges it as soon as the required checks on master pass.
# Required checks come from branch protection: select "Lint & Build" (ci.yml).
#
# Requires a repo secret AUTO_MERGE_TOKEN: a personal access token (or GitHub
# App token) with Contents and Pull requests read/write on this repo.
# The default GITHUB_TOKEN cannot be used: a merge it performs does not fire
# the push event, so deploy.yml would never run for auto-merged PRs.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    # Skip drafts, and PRs from forks (secrets are unavailable to them).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check token is configured
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret AUTO_MERGE_TOKEN is not set. Without it, merges would not trigger the production deploy. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}

      - name: Enable auto-merge (squash)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
